# Servidor estático interno del frontend (detrás del proxy nginx).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fuentes e imágenes: cambian muy poco.
    location ~* ^/assets/(fonts|img)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # CSS y JS: el navegador los guarda pero revalida siempre con ETag (304 si no cambiaron),
    # así cada despliegue se ve al instante sin renombrar archivos.
    location ~* ^/assets/.+\.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
